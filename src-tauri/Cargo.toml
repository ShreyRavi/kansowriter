[package]
name = "kansowriter"
version = "0.1.0"
description = "Kansowriter for macOS: a quiet place to write"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde_json = "1"
# already in the tree through tauri: route every quit through the save-first path (src/terminate.rs);
# NSEvent/NSWindow/NSString are for the debug-only probe (src/probe.rs), unused code LTO drops
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSWindow", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSProcessInfo"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
